<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        :root { 
            --neon: #bc13fe; 
            --bg: #0b0c10; 
            --panel: rgba(15, 17, 26, 0.7); 
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }
        
        body { 
            background: radial-gradient(circle at 10% 15%, #1b0f31 0%, var(--bg) 60%),
                        radial-gradient(circle at 90% 85%, #08212e 0%, var(--bg) 100%);
            background-attachment: fixed;
            color: #e2e8f0; 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            margin: 0; 
            padding: 15px; 
            touch-action: none; 
            overflow: hidden; 
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* 滿版裝飾外殼 - 精緻的邊框發光 */
        .master-shell { 
            width: 100%; 
            max-width: 1400px; 
            margin: 0 auto; 
            padding: 1px; 
            background: linear-gradient(135deg, rgba(188, 19, 254, 0.4), rgba(0, 242, 255, 0.4)); 
            border-radius: 20px; 
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .main-box { 
            background: var(--panel); 
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 19px; 
            padding: 25px; 
            display: flex; 
            flex-direction: column; 
            height: 92vh; 
            box-sizing: border-box;
        }

        h1.title { 
            text-align: center; 
            letter-spacing: 15px; 
            text-shadow: 0 0 20px rgba(188, 19, 254, 0.6); 
            margin: 0 0 15px 0; 
            font-size: 24px; 
            color: #fff;
            font-weight: 300;
        }
        
        /* 控制列佈局 */
        .panel { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
            gap: 12px; 
            background: var(--glass-bg); 
            border: 1px solid var(--glass-border);
            padding: 15px; 
            border-radius: 14px; 
            margin-bottom: 15px; 
        }

        .control-group { display: flex; flex-direction: column; gap: 6px; }
        .input-row { display: flex; align-items: center; gap: 10px; }
        label { font-size: 11px; color: #aaa; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
        
        /* 數值輸入框毛玻璃化 */
        .num-input { 
            width: 55px; 
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid var(--glass-border); 
            color: #fff; 
            border-radius: 6px; 
            text-align: center; 
            font-size: 12px; 
            padding: 4px; 
            outline: none;
            transition: border-color 0.2s;
        }
        .num-input:focus { border-color: var(--neon); }

        /* 質感滑桿 */
        input[type=range] { 
            accent-color: var(--neon); 
            flex: 1; 
            cursor: pointer; 
            background: rgba(255,255,255,0.08);
            height: 5px;
            border-radius: 3px;
        }
        
        /* 模式盒毛玻璃化 */
        .mode-box { 
            display: flex; 
            border: 1px solid var(--glass-border); 
            background: rgba(0, 0, 0, 0.2);
            border-radius: 6px; 
            overflow: hidden; 
            margin-top: 2px; 
            padding: 2px;
        }
        .m-btn { 
            flex: 1; 
            padding: 6px; 
            background: transparent; 
            border: none; 
            color: #888; 
            cursor: pointer; 
            font-size: 11px; 
            font-weight: bold; 
            border-radius: 4px;
            transition: all 0.2s;
        }
        .m-btn.active { 
            background: var(--neon); 
            color: #fff; 
            box-shadow: 0 2px 10px rgba(188, 19, 254, 0.4);
        }

        /* 按鈕設計 */
        .btn-zone { display: flex; gap: 12px; margin-bottom: 15px; }
        .btn { 
            flex: 1; 
            padding: 12px; 
            border-radius: 10px; 
            font-weight: bold; 
            cursor: pointer; 
            border: 1px solid rgba(188, 19, 254, 0.5); 
            color: #e0aaff; 
            background: rgba(188, 19, 254, 0.06); 
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); 
            font-size: 13px;
            letter-spacing: 0.5px;
        }
        .btn:hover { 
            background: var(--neon); 
            color: white; 
            box-shadow: 0 0 15px rgba(188, 19, 254, 0.4);
            transform: translateY(-1px);
        }
        .btn:active { transform: translateY(1px); }

        .btn-copy { 
            border: none; 
            background: linear-gradient(135deg, #00f2ff, #00bfff); 
            color: #050505; 
            box-shadow: 0 4px 15px rgba(0, 242, 255, 0.15);
        }
        .btn-copy:hover { 
            box-shadow: 0 0 20px #00f2ff; 
        }

        /* 畫布定位佔位器 */
        .viewport-placeholder {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        /* 畫布視窗 */
        .viewport { 
            width: 100%; 
            flex-grow: 1; 
            background: rgba(5, 5, 8, 0.4); 
            border-radius: 14px; 
            overflow: hidden; 
            position: relative; 
            cursor: grab; 
            border: 1px solid var(--glass-border); 
            box-shadow: inset 0 4px 20px rgba(0,0,0,0.6);
        }
        .viewport:active { cursor: grabbing; }

        /* 強制拔出並完全覆蓋全螢幕的樣式 */
        .viewport.fullscreen {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 99999 !important;
            border-radius: 0 !important;
            margin: 0 !important;
            background: #050508 !important;
        }
        
        #ascii-layer { 
            position: absolute; 
            top: 0; 
            left: 0; 
            padding: 100px; 
            white-space: pre; 
            font-family: 'Courier New', monospace; 
            line-height: 1; 
            transform-origin: 0 0; 
            text-shadow: 0 0 2px rgba(255,255,255,0.1);
        }
        
        .hint { position: absolute; bottom: 12px; right: 12px; font-size: 11px; color: #666; pointer-events: none; letter-spacing: 0.5px; z-index: 10; }
        input[type="file"] { display: none; }

        /* 全螢幕懸浮按鈕 */
        .btn-fs {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 100000;
            padding: 8px 14px;
            font-size: 12px;
            font-weight: bold;
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .btn-fs:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
<div class="master-shell">
    <div class="main-box">
        <h1 class="title">𝟟𝔹𝟠𝕋圖轉字</h1>
        <div class="panel" id="ui-controls">
            <div class="control-group">
                <label>1. 模式切換</label>
                <div class="mode-box">
                    <button class="m-btn active" id="m-char" onclick="setMode('char')">文字模式</button>
                    <button class="m-btn" id="m-emoji" onclick="setMode('emoji')">符號模式</button>
                </div>
                <button class="btn" style="margin-top:5px" onclick="document.getElementById('f').click()">讀取影像</button>
                <input type="file" id="f" accept="image/*">
            </div>
            <div class="control-group">
                <label>2. 寬度密度</label>
                <div class="input-row"><input type="range" id="wr" min="10" max="600" value="150"><input type="number" id="wn" class="num-input" value="150"></div>
            </div>
            <div class="control-group">
                <label>3. 亮度內容</label>
                <div class="input-row"><input type="range" id="br" min="-100" max="100" value="0"><input type="number" id="bn" class="num-input" value="0"></div>
            </div>
            <div class="control-group">
                <label>4. 清楚度(對比)</label>
                <div class="input-row"><input type="range" id="cr" min="1" max="3" step="0.1" value="1.2"><input type="number" id="cn" class="num-input" value="1.2" step="0.1"></div>
            </div>
            <div class="control-group">
                <label>5. 比例補償</label>
                <div class="input-row"><input type="range" id="hr" min="0.1" max="1.5" step="0.1" value="0.4"><input type="number" id="hn" class="num-input" value="0.4" step="0.1"></div>
            </div>
        </div>
        <div class="btn-zone">
            <button class="btn btn-copy" id="cp">複製轉換後的內容</button>
            <button class="btn" onclick="resetView()" style="flex:0.3">重置視角</button>
        </div>
        <div class="viewport-placeholder" id="v-container">
            <div class="viewport" id="va">
                <button class="btn-fs" id="fs-btn" onclick="toggleFullScreen(event)">全螢幕預覽</button>
                <div class="hint">雙指縮放 / 拖拽移動</div>
                <pre id="ascii-layer">READY...</pre>
            </div>
        </div>
    </div>
</div>

<script>
    const f=document.getElementById('f'), l=document.getElementById('ascii-layer'), va=document.getElementById('va'), vContainer=document.getElementById('v-container');
    const wr=document.getElementById('wr'), wn=document.getElementById('wn'), br=document.getElementById('br'), bn=document.getElementById('bn');
    const cr=document.getElementById('cr'), cn=document.getElementById('cn'), hr=document.getElementById('hr'), hn=document.getElementById('hn'), cp=document.getElementById('cp');
    const fsBtn=document.getElementById('fs-btn');
    const charList = "$@B%8&WM#*oahkbdpqZO0QLCJUYXzcvunxrjft/\\|()1{}[]?-_+~<>i!lI;:,\"^`'. ";
    const emojiMap = [{e:"⬛",r:0,g:0,b:0},{e:"⬜",r:255,g:255,b:255},{e:"🟥",r:230,g:30,b:30},{e:"🟧",r:255,g:150,b:0},{e:"🟨",r:255,g:215,b:0},{e:"🟩",r:50,g:205,b:50},{e:"🟦",r:30,g:144,b:255},{e:"🟪",r:160,g:32,b:240},{e:"🌚",r:50,g:50,b:50},{e:"🌳",r:34,g:139,b:34}];
    
    let currentMode = 'char', img = null, sc = 1, px = 50, py = 50, isDragging = false, lx, ly, ld;

    function toggleFullScreen(e) {
        e.stopPropagation();
        const isFS = va.classList.toggle('fullscreen');
        if (isFS) {
            // 移動到 body 最外層，打破所有父級 CSS 限制
            document.body.appendChild(va);
            fsBtn.textContent = "退出全螢幕";
        } else {
            // 放回原本的盒子裡
            vContainer.appendChild(va);
            fsBtn.textContent = "全螢幕預覽";
        }
    }

    function setMode(m) {
        currentMode = m;
        document.getElementById('m-char').classList.toggle('active', m === 'char');
        document.getElementById('m-emoji').classList.toggle('active', m === 'emoji');
        l.style.color = (m === 'char') ? "#ffffff" : "initial";
        render();
    }

    function render() {
        if (!img) return;
        const cv = document.createElement('canvas'), ctx = cv.getContext('2d');
        const W = parseInt(wn.value), H = Math.floor((img.height / img.width) * W * parseFloat(hn.value));
        cv.width = W; cv.height = H;
        ctx.drawImage(img, 0, 0, W, H);
        const d = ctx.getImageData(0, 0, W, H).data;
        let res = "", bAdj = parseInt(bn.value), cAdj = parseFloat(cn.value);
        
        for (let i = 0; i < d.length; i += 4) {
            if (currentMode === 'char') {
                let v = (0.2126 * d[i] + 0.7152 * d[i+1] + 0.0722 * d[i+2]);
                v = ((v - 128) * cAdj) + 128 + bAdj;
                v = Math.max(0, Math.min(255, v));
                res += charList[Math.floor((v / 255) * (charList.length - 1))];
            } else {
                let r=d[i], g=d[i+1], b=d[i+2];
                let min=Infinity, best="⬛";
                for(let item of emojiMap){
                    let diff = Math.sqrt((r-item.r)**2+(g-item.g)**2+(b-item.b)**2);
                    if(diff < min){ min=diff; best=item.e; }
                }
                res += best;
            }
            if (((i/4)+1) % W === 0) res += "\n";
        }
        l.style.fontSize = Math.max(1, 1000/W)+"px"; 
        l.style.lineHeight = l.style.fontSize;
        l.textContent = res; 
        update();
    }

    function update() { l.style.transform = `translate(${px}px, ${py}px) scale(${sc})`; }
    function resetView() { sc = 1; px = 50; py = 50; update(); }

    const sync = (r, n) => { r.oninput = e => { n.value = r.value; render(); e.stopPropagation(); }; n.oninput = e => { r.value = n.value; render(); e.stopPropagation(); }; };
    sync(wr, wn); sync(br, bn); sync(cr, cn); sync(hr, hn);

    va.onwheel = (e) => { if (e.ctrlKey || e.metaKey) { e.preventDefault(); sc = Math.min(Math.max(0.1, sc * (e.deltaY > 0 ? 0.9 : 1.1)), 10); update(); } };
    va.onmousedown = (e) => { isDragging = true; lx = e.clientX; ly = e.clientY; };
    window.addEventListener('mousemove', (e) => { if (!isDragging) return; px += e.clientX - lx; py += e.clientY - ly; lx = e.clientX; ly = e.clientY; update(); });
    window.addEventListener('mouseup', () => isDragging = false);

    va.ontouchstart = (e) => {
        if (e.target.classList.contains('btn-fs')) return; 
        if (e.touches.length === 1) { isDragging = true; lx = e.touches[0].clientX; ly = e.touches[0].clientY; }
        else if (e.touches.length === 2) { ld = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); }
    };
    va.ontouchmove = (e) => {
        if (e.target.classList.contains('btn-fs')) return;
        if (e.touches.length === 1 && isDragging) { px += e.touches[0].clientX - lx; py += e.touches[0].clientY - ly; lx = e.touches[0].clientX; ly = e.touches[0].clientY; }
        else if (e.touches.length === 2) { const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); sc *= d / ld; ld = d; }
        update(); e.preventDefault();
    };
    va.ontouchend = () => isDragging = false;

    f.onchange = (e) => { const r = new FileReader(); r.onload = (ev) => { img = new Image(); img.onload = render; img.src = ev.target.result; }; r.readAsDataURL(e.target.files[0]); };
    cp.onclick = () => { navigator.clipboard.writeText(l.textContent); const t=cp.textContent; cp.textContent="✓ 已複製"; setTimeout(()=>cp.textContent=t, 2000); };
</script>
</body>
</html>
