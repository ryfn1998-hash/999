<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --neon: #bc13fe;
            --bg: #0d0e15;
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        body {
            background: radial-gradient(circle at 20% 20%, #1e1035 0%, var(--bg) 50%),
                        radial-gradient(circle at 80% 80%, #0a2533 0%, var(--bg) 100%);
            background-attachment: fixed;
            color: #e2e8f0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* 滿版裝飾外殼 - 改為精緻的毛玻璃邊框發光效果 */
        .master-shell {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 1px;
            background: linear-gradient(135deg, rgba(188, 19, 254, 0.3), rgba(0, 242, 255, 0.3));
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        .main-box {
            background: rgba(15, 17, 26, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 23px;
            padding: 40px;
            border: 1px solid var(--glass-border);
        }

        h2 {
            margin-top: 0;
            margin-bottom: 35px;
            color: #fff;
            text-shadow: 0 0 20px rgba(255,255,255,0.2);
        }

        /* 控制列佈局 - 加強毛玻璃層次 */
        .panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 25px;
            border-radius: 16px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .control-group { display: flex; flex-direction: column; gap: 12px; }
        label { font-size: 13px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; font-weight: 500; }
        
        /* 質感滑桿 */
        input[type=range] { 
            accent-color: var(--neon); 
            cursor: pointer; 
            width: 100%; 
            background: rgba(255,255,255,0.1);
            height: 6px;
            border-radius: 3px;
        }

        /* 按鈕設計 */
        .action-row { display: flex; gap: 15px; margin-bottom: 25px; }
        .btn {
            flex: 1;
            padding: 16px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
            font-size: 16px;
            letter-spacing: 0.5px;
        }
        
        .btn-upload { 
            border: 1px solid rgba(188, 19, 254, 0.5); 
            color: #e0aaff; 
            background: rgba(188, 19, 254, 0.1); 
        }
        .btn-upload:hover { 
            background: var(--neon); 
            color: white; 
            box-shadow: 0 0 20px rgba(188, 19, 254, 0.4);
            border-color: var(--neon);
        }
        
        .btn-copy { 
            border: none; 
            background: linear-gradient(135deg, #00f2ff, #00bfff); 
            color: #050505; 
            box-shadow: 0 4px 15px rgba(0, 242, 255, 0.2);
        }
        .btn-copy:hover { 
            box-shadow: 0 0 25px #00f2ff;
            transform: translateY(-1px);
        }
        .btn-copy:active { transform: translateY(1px); }

        /* 滿版輸出顯示區 */
        .preview-window {
            width: 100%;
            background: rgba(5, 5, 8, 0.5);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            overflow: auto;
            min-height: 500px;
            backdrop-filter: inset(10px);
        }

        #ascii-output {
            margin: 0;
            padding: 30px;
            display: inline-block;
            white-space: pre;
            font-family: 'Courier New', Courier, monospace;
            line-height: 1;
            letter-spacing: 0;
            color: #fff;
            text-shadow: 0 0 2px rgba(255,255,255,0.3);
        }

        input[type="file"] { display: none; }
    </style>
</head>
<body>

<div class="master-shell">
    <div class="main-box">
        <h2 style="text-align: center; font-weight: 300; letter-spacing: 5px;">圖轉字</h2>

        <div class="panel">
            <div class="control-group">
                <label>1. 來源控制</label>
                <button class="btn btn-upload" onclick="document.getElementById('file-in').click()">讀取影像</button>
                <input type="file" id="file-in" accept="image/*">
            </div>

            <div class="control-group">
                <label>2. 寬度密度 (Width: <span id="w-val">120</span>)</label>
                <input type="range" id="w-range" min="40" max="450" value="120">
            </div>

            <div class="control-group">
                <label>3. 複製補償 (貼出畸形請調小: <span id="h-val">0.40</span>)</label>
                <input type="range" id="h-range" min="0.01" max="2.0" step="0.01" value="0.40">
            </div>
        </div>

        <div class="action-row">
            <button class="btn btn-copy" id="copy-btn">複製內容到剪貼簿</button>
        </div>

        <div class="preview-window">
            <pre id="ascii-output">READY...</pre>
        </div>
    </div>
</div>

<script>
    const fileIn = document.getElementById('file-in');
    const output = document.getElementById('ascii-output');
    const wRange = document.getElementById('w-range');
    const hRange = document.getElementById('h-range');
    const wVal = document.getElementById('w-val');
    const hVal = document.getElementById('h-val');
    const copyBtn = document.getElementById('copy-btn');
    
    const charList = "MND8OZ$7I?+=~:,.. ";
    let activeImg = null;

    function coreRender() {
        if (!activeImg) return;

        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');

        const width = parseInt(wRange.value);
        const compensate = parseFloat(hRange.value);
        const height = Math.floor((activeImg.height / activeImg.width) * width * compensate);

        canvas.width = width;
        canvas.height = height;
        ctx.drawImage(activeImg, 0, 0, width, height);

        const pixels = ctx.getImageData(0, 0, width, height).data;
        let result = "";

        for (let y = 0; y < height; y++) {
            for (let x = 0; x < width; x++) {
                const i = (y * width + x) * 4;
                const brightness = (0.299 * pixels[i] + 0.587 * pixels[i+1] + 0.114 * pixels[i+2]);
                const charIdx = Math.floor((brightness / 255) * (charList.length - 1));
                result += charList[charIdx];
            }
            result += "\n";
        }

        const fontSize = Math.max(1, 1100 / width);
        output.style.fontSize = fontSize + "px";
        output.style.lineHeight = fontSize + "px";
        output.textContent = result;
    }

    fileIn.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            activeImg = new Image();
            activeImg.onload = coreRender;
            activeImg.src = ev.target.result;
        };
        reader.readAsDataURL(file);
    };

    wRange.oninput = () => { wVal.textContent = wRange.value; coreRender(); };
    hRange.oninput = () => { hVal.textContent = hRange.value; coreRender(); };

    copyBtn.onclick = () => {
        if (output.textContent.length < 10) return;
        navigator.clipboard.writeText(output.textContent).then(() => {
            const oldTxt = copyBtn.textContent;
            copyBtn.textContent = "已複製！貼到 Discord 試試看";
            setTimeout(() => copyBtn.textContent = oldTxt, 2000);
        });
    };
</script>

</body>
</html>
